<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
  }
  .slot {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .adsbygoogle {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="slot">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7931973085541540" crossorigin="anonymous"></script>
    <ins class="adsbygoogle"
         data-ad-client="ca-pub-7931973085541540"
         data-ad-slot="5583456558"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="slot">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7931973085541540" crossorigin="anonymous"></script>
    <ins class="adsbygoogle"
         data-ad-client="ca-pub-7931973085541540"
         data-ad-slot="4916563529"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

</div>
</body>
</html>
